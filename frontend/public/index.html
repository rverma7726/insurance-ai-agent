<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Insurance AI Agent</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; }
      .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
      header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 30px; border-radius: 10px; margin-bottom: 30px; }
      header h1 { font-size: 32px; margin-bottom: 10px; }
      .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .card { background: white; border-radius: 10px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
      .card h2 { margin-bottom: 15px; color: #333; font-size: 20px; }
      button { background: #667eea; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; font-weight: 600; }
      button:hover { background: #764ba2; }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🏦 Insurance AI Agent</h1>
        <p>Autonomous AI for Policy Analytics & Customer Retention</p>
      </header>
      <div class="dashboard">
        <div class="card">
          <h2>Dashboard</h2>
          <p>Loading...</p>
        </div>
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>
